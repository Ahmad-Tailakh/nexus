[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "Production-grade Python backend platform for application, environment, service, and deployment management."
requires-python = ">=3.12,<3.13"



dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "SQLAlchemy",
    "psycopg[binary]",
    "alembic",
    "python-dotenv",
    "marshmallow",
    "pwdlib[argon2]",
    "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
